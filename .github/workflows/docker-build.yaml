name: Docker Build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Had no filter at all, so a docs-only PR paid for a full image build.
      - name: Check for image-affecting changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            docker:
              - 'Dockerfile'
              - '.dockerignore'
              - 'docker-compose.yml'
              - 'pyproject.toml'
              - 'poetry.lock'
              - '.github/workflows/docker-build.yaml'

      - name: Set up Docker Buildx
        if: steps.changes.outputs.docker == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        if: steps.changes.outputs.docker == 'true'
        run: docker build -t wifey-bot .
