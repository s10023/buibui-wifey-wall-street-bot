name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: read

# A newer push supersedes the in-flight run on main too: HEAD's run is the one
# that says whether main is green, and `make wait-ci-main` follows a
# superseded SHA to the new HEAD. Intermediate merges keep no run of their own.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Check for Markdown changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            markdown:
              - '**/*.md'
              - '.markdownlint.json'
              - '.markdownlint-cli2.jsonc'
            skills:
              - '.claude/skills/**'
              - '.github/scripts/update-skills.sh'

      - name: markdownlint-cli2
        if: steps.changes.outputs.markdown == 'true'
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          config: .markdownlint.json
          globs: |
            **/*.md
            !venv

      # Folded in from the deleted update-skills.yaml, which ran this same
      # validator on a daily 03:00 cron. It writes nothing, so its "open a PR if
      # anything changed" step could never fire — the check only ever has
      # something to catch on the PR that edits a skill.
      - name: Validate SKILL.md frontmatter
        if: steps.changes.outputs.skills == 'true'
        run: ./.github/scripts/update-skills.sh

      # Deliberately UNCONDITIONAL and deliberately in THIS job. The same sweep
      # runs in `make test` via tests/test_sanity_checks.py, but that job sits
      # behind a `**/*.py` path filter — so on a docs-only PR, which is exactly
      # the change this check guards against, it would never run at all. This
      # job installs no dependencies, so the three legs needing the project's
      # imports report SKIPPED here and the four pure-text ones still gate.
      - name: Doc-drift sanity checks
        run: python3 tools/sanity_checks.py

  lint-typecheck-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Check for Python changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            python:
              - '**/*.py'
              - 'pyproject.toml'
              - 'poetry.lock'
              - '.github/workflows/lint.yaml'
              # Read by tests/test_hook_wiring.py and tests/test_context_guard.py.
              - '.claude/settings.json'
              - '.claude/hooks/*.json'

      - name: Set up Python
        if: steps.changes.outputs.python == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Poetry
        if: steps.changes.outputs.python == 'true'
        run: curl -sSL https://install.python-poetry.org | python3 -

      # Poetry's cache dir holds both the wheel artifacts and the virtualenv, so
      # a hit skips the whole resolve+download+build. Same key in both jobs,
      # deliberately — they share one cache.
      - name: Cache Poetry download cache
        if: steps.changes.outputs.python == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        if: steps.changes.outputs.python == 'true'
        run: make poetry-install

      - name: Lint Python
        if: steps.changes.outputs.python == 'true'
        run: poetry run ruff check .

      - name: Check Python formatting
        if: steps.changes.outputs.python == 'true'
        run: poetry run ruff format --check .

      - name: Type check
        if: steps.changes.outputs.python == 'true'
        run: poetry run mypy . .claude/hooks

      # Deliberately no --cov. Nothing in this repo consumes coverage: there is
      # no codecov/coveralls step, no fail_under gate, and coverage.xml was only
      # ever uploaded as an artifact nobody downloads. pytest-cov's tracer runs
      # on every line of every test, and this step is the bulk of the job, so
      # that was the most expensive unread file in CI. `make test-cov` still
      # produces it locally for anyone who actually wants to read it.
      # -q not -v: 1900 verbose lines make a failure harder to find, not easier.
      # --durations keeps the slowest tests visible so the next tuning round
      # starts from data rather than a guess.
      - name: Run tests
        if: steps.changes.outputs.python == 'true'
        run: poetry run pytest tests/ -q --durations=25 --junitxml=test-results.xml --ignore=tests/test_regression.py

      - name: Upload test results
        if: steps.changes.outputs.python == 'true' && !cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results.xml

  regression:
    name: Regression tests
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Check for Python changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          # The backtest surface only — NOT '**/*.py', which fired the golden
          # run on every tools/ or web/ change. tests/test_regression.py imports
          # from analytics.* alone. pyproject/poetry.lock stay in on purpose: a
          # pandas or numpy bump moves the goldens, and finding that out
          # silently is exactly what the suite exists to prevent.
          filters: |
            python:
              - 'analytics/**/*.py'
              - 'pyproject.toml'
              - 'poetry.lock'
              - 'config/*.toml'
              - 'tests/test_regression.py'
              - 'tests/fixtures/**.parquet'
              - 'tests/fixtures/golden_*.json'
              - 'scripts/extract_regression_fixture.py'
              - '.github/workflows/lint.yaml'

      - name: Set up Python
        if: steps.changes.outputs.python == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Poetry
        if: steps.changes.outputs.python == 'true'
        run: curl -sSL https://install.python-poetry.org | python3 -

      - name: Cache Poetry download cache
        if: steps.changes.outputs.python == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        if: steps.changes.outputs.python == 'true'
        run: make poetry-install

      - name: Run regression tests
        if: steps.changes.outputs.python == 'true'
        run: make test-regression

  frontend-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Check for frontend changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            frontend:
              - 'web/ui/**'
              - '.github/workflows/lint.yaml'

      - name: Set up Node
        if: steps.changes.outputs.frontend == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/ui/package-lock.json

      - name: Install frontend dependencies
        if: steps.changes.outputs.frontend == 'true'
        run: cd web/ui && npm ci

      - name: Build frontend
        if: steps.changes.outputs.frontend == 'true'
        run: cd web/ui && npm run build

      - name: Svelte type check
        if: steps.changes.outputs.frontend == 'true'
        run: cd web/ui && npx svelte-check
