# Swing trading profile — medium/higher timeframes, trend-following strategies.
#
# Purpose: catch multi-day moves on 4h and 1d candles.
# Best suited for: trend_day, marubozu, fib_golden_zone, order_block, eqh_eql,
#                  morning_evening_star, bos (as trend-continuation confirmation).
# Not included: noise-heavy short-TF strategies (orb, doji, inside_bar).
#
# Usage: make buibui-signal-watch CONFIG=config/swing.toml

timeframes = ["4h", "1d"]
telegram = true
min_sl_pct = 0.01

# Wider SL for swing setups, 3x R target
sl_pct = 0.03
# atr_sl_multiplier = 2.5  # ATR-based SL: SL distance = N × ATR14; overrides sl_pct when set
# atr_sl_multiplier_values = [1.0, 1.5, 2.0, 2.5, 3.0]  # sweep: comparison table across multipliers
tp_r = 3.0

# Longer cooldown — same setup shouldn't re-fire within 24 hours
cooldown_seconds = 86400

# Trend-following and structural strategies
strategies = [
    'trend_day',
    'marubozu',
    'fib_golden_zone',
    'order_block',
    'eqh_eql',
    'morning_evening_star',
    'bos',
    'engulfing',
    'hammer_hanging_man',
    'liquidity_sweep',
]

# ICT weekly cycle — suppress Mon/Fri noise on longer TFs
day_filter = true

# Backtest window — use a longer window for swing trade validation
days = 200
min_trades = 20         # global fallback
# Per-TF overrides — calibrated from DB (200d). To scale: base × (your_days / 200)
min_trades_4h = 10
min_trades_1d = 5
fee_pct = 0.0005
# tp_r_values = [1.0, 1.5, 2.0, 2.5, 3.0]  # TP ratio sweep — prints comparison table instead of ranked sweep

# trend_day restricted to its valid TFs (also the only TFs in this profile)
[strategy_timeframes]
trend_day = ["4h", "1d"]

# Per-strategy TP/SL overrides. F6 findings (4h/1d only in this profile):
# [strategy_params.engulfing]
# tp_r = 3.0
# [strategy_params.bos]
# tp_r_4h = 2.5
# [strategy_params.fib_golden_zone]
# tp_r_4h = 3.0

[backtest]
mode = "hard"
days = 200
# Thresholds apply to directional trade count (longs for LONG alerts, shorts for SHORT).
# Recalibrated from backtest_runs DB p25 directional counts (90d window):
#   4h p25_long=4 → 5, 1d p25_long=0 → 2
min_trades = 12         # global fallback (directional)
min_trades_4h = 5
min_trades_1d = 2
min_avg_r = 0.0         # hard mode: suppress if directional avg_r < this (positive EV gate)
# filter_threshold = 0.4   # legacy win-rate gate (replaced by min_avg_r)
# volume_suppress = false   # enable after confirming via `make buibui-backtest` that low-vol trades underperform
# liq_sweep_use_fib = true  # set false to compare pivot-sweep mode vs fib-extension mode
# liq_sweep_fib_range_close = false  # (fib mode only) true = close must be < swing_high (inside range), not just < fib level
