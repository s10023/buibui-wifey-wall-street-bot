# strategy_params.toml — shared base for main signal_watch configs.
#
# Configs that extend this file:
#   signal_watch.toml          (tue_thu day filter)
#   signal_watch_weekdays.toml (weekdays day filter)
#   signal_watch_all.toml      (no day filter)
#
# Usage: add  extends = "strategy_params.toml"  as the first line of a config.
# Keys in the extending config override the base (scalars/arrays replaced, dicts merged).
# The 'extends' key is consumed by the loader — it is not a real TOML field.

# Telegram dispatch is OFF by default so the --telegram CLI flag (TELEGRAM=1 on
# the Makefile, set by `make go-live`) is the single master switch. A base value
# of `true` here silently forced sends on every run, ignoring TELEGRAM= entirely.
telegram = false
min_sl_pct = 0.005

# Backtest sweep runner (make wifey-backtest) reads these top-level keys:
days = 365              # fallback lookback window (ignored when since is set); equity defaults to 1y
# T13: legacy crypto anchor "2025-09-12" dropped — equity yfinance covers years.
# T14 (WFO + recalibrate) sets a fresh `since` anchor tied to the equity backfill window.
# since = "2024-05-15"
min_trades = 20         # hide combos with fewer trades in sweep table (global fallback)
# Per-TF overrides — equity TFs only (4h | 1d | 1wk).
# Signal rate scales by candles-per-year:
#   4h:  ~6.5/day × 252 RTH days ≈ 1638 candles/yr
#   1d:  252 candles/yr
#   1wk: 52 candles/yr
# Thresholds are first-pass; T14 WFO refines per equity backtest results.
min_trades_4h  = 10
min_trades_1d  = 5
min_trades_1wk = 2
fee_pct = 0.0          # T13: equity fees disabled until broker fee model lands (Phase B)

# F8 bias layer — identical across all three main configs.
[bias]
adr_suppress_threshold = 0.80

# F8 HTF EMA directional gate — suppress signals against the HTF trend.
# Per-strategy anchors derived from the 24-cell tue_thu sweep (PR #344):
#   default 4h EMA-50 lifts aggregate avg_r by +0.059 on tue_thu.
#   Per-strategy 1d EMA-50 override flips strategies that 4h hurts
#   (ema, orb, eqh_eql) plus marubozu — net mix
#   captures ~+0.074 lift. 4h EMA-200 dropped (-0.001 delta = no benefit).
#
# Soft-tested 2026-05-05; flipped to hard 2026-05-06.
[bias.htf_ema]
enabled = true
mode = "hard"                  # "soft" = log only; "hard" = drop opposing signals
default_tf = "4h"
default_period = 50
default_slope_lookback = 10
deadband_pct = 0.003           # |slope| < 0.3% over slope_lookback bars → allow

[bias.htf_ema.per_strategy]
ema             = { tf = "1d", period = 50, slope_lookback = 10 }
orb             = { tf = "1d", period = 50, slope_lookback = 10 }
eqh_eql         = { tf = "1d", period = 50, slope_lookback = 10 }
marubozu        = { tf = "1d", period = 50, slope_lookback = 10 }

# v2 Phase 2 regime gate (per redesign §6).
# Step −1 of the bias chain — runs before F8. Drops signals whose strategy
# type is not enabled in the current 4h-classified regime. F8 then refines
# direction within the allowed regime.
#
# Soft mode first (logs only) — observe ≥2 weeks before flipping to hard:
#   - need ≥500 suppressed candidates in logs.
#   - backtest the suppressed subset → must show avg_r ≤ 0 to justify drop.
#
# `unknown` regime and cache misses always fall open (warmup safe).
[bias.regime]
enabled = true
mode = "soft"                  # "soft" = log only; "hard" = drop suppressed
htf_tf = "4h"                  # regime classified off 4h candles (§6)

# Strategy-type → list of regimes where the type is allowed.
# Continuation types (`trend`, `fib`) only fire in `trend` regime.
# Reversion types (`flow`, `structural`, `price_action`, `candlestick`) and
# `session` are allowed everywhere; F8 then trims counter-trend in `trend`.
# NOTE: `fib` is bound to BOS-anchored detectors (ote_entry).
# If a pure-fib reversion strategy ships, override it via per_strategy below.
[bias.regime.enabled_regimes]
trend         = ["trend"]
fib           = ["trend"]
flow          = ["trend", "range", "high_vol"]
structural    = ["trend", "range", "high_vol"]
price_action  = ["trend", "range", "high_vol"]
candlestick   = ["trend", "range", "high_vol"]
session       = ["trend", "range", "high_vol"]

# Per-strategy override — pin a specific strategy out of its type's mapping.
# bos: the original "BOS = trend continuation" hypothesis was data-falsified by
# the 2026-05-13 routing audit (`tools/bos_routing_audit.py`, n=72,643). Trend
# regime is bos's WORST (avg_r=−0.163) while high_vol is best (avg_r=+0.020) and
# range is middle (−0.048). Flipped to ["high_vol", "range"]. Replay-verify
# before any hard flip.
[bias.regime.per_strategy]
bos = ["high_vol", "range"]

# T2c per-strategy directional suppress (Step −0.5 of bias chain).
# Drops signals matching `[strategy_params.<name>].suppress_long` /
# `.suppress_short`. Cheapest filter — pure per-event flag, runs before F8.
# Justified by `tools/bos_routing_audit.py` (2026-05-13, n=72,643): the dominant
# axis is DIRECTION (short +0.140R vs long −0.268R, spread 0.40R) — bigger than
# regime (spread 0.18R) and session (0.23R). bos longs alone bleed avg_r=−0.27
# on n=34,767 — the single largest pool of avoidable loss in the system.
# Soft mode first; replay-verify via `tools/direction_filter_replay.py` and
# observe ≥2 weeks before flipping to hard.
[bias.direction_filter]
enabled = true
mode = "soft"

# D10 steps 3+4 — live co-firing confluence detection.
# window: look back this many candles in the signals DB for a same-TF co-firing partner.
# min_avg_r: only append the blockquote when the combo backtest avg_r meets this threshold.
# cross_tf_window_hours: window=8h from sweep (1d→1h and 4h→15m pairs, Apr 2026).
[combo]
window = 5
min_avg_r = 1.0
cross_tf_window_hours = 8.0

# Backtest filter defaults — identical across all three main configs.
# signal_config.py reads these from [backtest]; backtest_config.py reads min_trades_*tf
# from the top level (above). Both sets are needed.
[backtest]
mode = "hard"
cache_enabled = true
days = 365              # fallback (equity 1y baseline); T14 may switch to `since` anchor
# since = "2024-05-15"  # T14 sets equity backfill-anchored start date
min_trades = 12
min_trades_4h  = 5
min_trades_1d  = 2
min_trades_1wk = 1
min_avg_r = 0.0

# Phase 0.4 equity cost model (step 2 — ENABLED 2026-06-15) — replaces the flat
# fee_pct with half-spread (by dollar-ADV liquidity bucket) + sqrt market impact
# + short borrow + commission, all charged in R. Enabling this MOVED the
# regression goldens by design (spec §4.4: db-update + golden refresh +
# recalibrate). Params below are the built-in conservative defaults, pinned here
# so the live cost stack is reproducible if code defaults later change.
[backtest.cost_model]
enabled = true
adv_thresholds = [5e6, 5e7, 5e8]          # dollar-ADV bucket edges
half_spread_bps = [20.0, 8.0, 3.0, 1.0]   # per bucket, least → most liquid
impact_coef = 1.0                         # sqrt-law coefficient
notional_usd = 10000.0                    # assumed order size
borrow_rate_annual = 0.01                 # shorts: conservative constant
commission_bps = 0.0                      # US retail ≈ 0
adv_window_days = 20.0                    # trailing ADV / sigma window

# Per-strategy flags consistent across all three main configs.
# Only non-tp_r fields are here — tp_r values are calibrated per day_filter in each config.
# Strategies not listed here have no per-strategy flag override (loader default applies).
#
# GATE CONJUNCTION (2026-08-06): `volume_suppress*` and the [bias] ADR gate select
# for OPPOSITE bars — ADR keeps quiet small-range bars, volume_suppress keeps
# >=1.5x-average-volume bars, and range/volume correlate at +0.61 (1d) / +0.67 (4h).
# Measured on the 13 live symbols: P(pass both) = 0.0046 vs 0.036 if independent, an
# 8x shortfall. Any strategy carrying volume_suppress WITHOUT `adr_exempt = true` is
# therefore near-voided. `load_signal_config` now REFUSES that pairing outright.
# Set `adr_exempt = true` (entry geometry genuinely fires at extremes) or drop the
# volume flag — never declare both without the exemption.
[strategy_params.bos]
# volume_suppress removed 2026-08-06 — the LAST of the four crypto-era A14b volume flags.
# bos hit BOTH problems, on different configs, which is why it reads differently below:
#   - signal_watch.toml: adr_exempt was set here, so the gates never conflicted. The flag
#     acted alone, at its own base rate, and was NOT part of the conjunction defect.
#   - signal_watch_weekdays.toml: adr_exempt was config-local to signal_watch.toml and so
#     was never inherited — there bos DID run the voided conjunction (1d: n=86 @ -0.033R
#     vs n=1328 @ +0.071R once exempt). Fixed by moving adr_exempt into this base file.
# Removing the flag outright is a separate finding from that inheritance bug: its own
# claim does not replicate on equities. Split the unsuppressed trades on the gate's own
# `is_low_volume` predicate and normal-vol does NOT win:
#   4h  tue_thu   Δ=-0.133  p=0.610      1d  tue_thu   Δ=+0.061  p=0.756
#   4h  weekdays  Δ=-0.299  p=0.113      1d  weekdays  Δ=-0.069  p=0.626
#   1wk weekdays  Δ=+0.521  p=0.203
# The point estimate carries the WRONG SIGN on 3 of 5 cells, every 95% CI straddles zero,
# and the flag was discarding 90-94% of bos's signals (1d: 1,210 -> 71) to buy an effect
# measured at zero. Original note: "A14b: normal-vol wins Δ=+0.11R" — crypto-derived.
# This is removal of a falsified flag, NOT a tp_r/gate sweep (nothing was searched or
# maximised); the TA freeze is intact.
adr_exempt = true             # breakout — fires in continuation direction; ADR gate degrades it.
                              # MOVED here from signal_watch.toml 2026-08-06 (see above) so BOTH
                              # configs inherit it. KEPT rather than removed: like volume_suppress
                              # it is not statistically distinguishable (p=0.26–0.96), but it
                              # PRESERVES sample (1d: n=1189 vs 831) and its point estimates mildly
                              # favour exemption on 1d/1wk — the opposite side of the same evidence
                              # trade-off, so the two flags resolve in opposite directions.
# suppress_long REMOVED 2026-08-06 (PR #143) — it was a CRYPTO-ERA flag, not an equity one.
# It arrived 2026-05-13 in parent PR #367, justified by `tools/bos_routing_audit.py` (parent
# PR #365, same day) citing "long-side avg_r=−0.268R on n=34,767" out of an n=72,643 trade
# population. This fork was cut 2026-05-14 — one day later — so both the tool and the flag
# predate every equity bar we hold. The cited n cannot be equity data: this repo's ENTIRE
# `backtest_trades` table holds 24,196 rows, of which 1,152 are bos. Those were Binance
# futures trades.
# Re-derived on equities (13-sym watchlist, live-parity, competed sample — all config
# strategies present so the conflict resolver runs as it does live — since 2018-01-02) the
# claim INVERTS on both timeframes. Long is the better leg, not the worse one (95% boot CI):
#   1d  long +0.351 [+0.191, +0.520] n=417   short −0.352 [−0.494, −0.198] n=318
#   4h  long −0.036 [−0.313, +0.243] n=144   short −0.488 [−0.675, −0.279] n=172
# Same defect class as the four crypto-era volume flags removed in #141; that sweep missed
# this one because it greps as a DIRECTION flag, not a volume flag.
# Harmless *today* only because [bias.direction_filter] is mode="soft" (logs, keeps —
# analytics/signal/gates.py:311-336). But that block's own comment prescribes flipping to
# hard after "≥2 weeks", and that window passed ~3 months ago. Flipping it with this flag
# in place would have suppressed bos's better leg and left only the significantly-negative
# short — a latent inversion, exactly the shape #141 and #142 kept finding.
# Deliberately NOT replaced with `suppress_short = true`: the 1d long-positive above is 13
# megacap survivors across a 2018-2026 bull market — the same survivorship/beta confound
# that voided the xsmom/residual.py long-only read — and picking a direction flag to
# maximise avg R is precisely the frozen sweep work. Removing a falsified flag is
# correctness; adding its mirror is not. Audit: docs/audits/2026-08-06-bos-timeframe-and-crypto-era-direction-flag.md

[strategy_params.engulfing]
# volume_suppress_long removed 2026-08-06 — gate conjunction (see block comment above).
# The A14b delta below was measured pre-ADR-gate and never re-derived against it; with
# the ADR gate live it destroyed ~half the long sample and INVERTED the sign
# (1d tue_thu: n=135 @ −0.273R with the flag vs n=271 @ +0.042R without, cost-inclusive).
# Original note: LONG low-vol -0.13R→+0.22R (tue_thu Δ=+0.36R); SHORT low-vol +0.72R — keep.
volume_spike_boost = true     # A15 spike sweep: spike +0.59R vs normal +0.23R (73 spikes).
                              # INERT as of 2026-08-06, stated rather than silently dropped: the
                              # engine reads _boost only inside `if _suppress and is_low_vol`
                              # (backtest/engine.py), so with no volume_suppress on engulfing and
                              # the global default false, this flag now changes no filtering
                              # decision. `Trade.volume_spike` is still tagged, so the A15 split
                              # stays measurable. Kept because it records a real measurement;
                              # re-arm it only alongside a volume_suppress that has been checked
                              # against the ADR gate (see the block comment above).

[strategy_params.pin_bar]
# pin_bar audit (2026-05-19): retired stale crypto-era tp_r_long=5.0 / tp_r_short=3.0
# (ETH 1h+15m / SOL 1h derived). Equity per-TF directional / combined keys committed
# in signal_watch{,_weekdays}.toml now cover all production (TF × day_filter) cells.
# Re-introduce here only via a new equity-validated sweep.
volume_suppress = false       # A14b: low-vol edge Δ=-0.22R

[strategy_params.hammer_hanging_man]
volume_suppress = false       # A14b: low-vol edge Δ=-0.35R

[strategy_params.morning_evening_star]
# Task A (2026-05-18): retired stale crypto-era tp_r_long=4.0 / tp_r_short=3.0
# (BTC/ETH 15m-derived). Equity per-TF directional / combined keys committed
# in signal_watch{,_weekdays}.toml now cover all production (TF × day_filter)
# cells. Re-introduce here only via a new equity-validated sweep.
volume_suppress = false       # A14b: low-vol edge (reversal confirmed)

[strategy_params.orb]
# volume_suppress removed 2026-08-06 — gate conjunction (see block comment above).
# The A14b Δ=+0.33R was a crypto-era measurement taken before the ADR gate existed.
# Under both gates orb × 4h was running live on ONE trade: n=1 vs n=256 @ +0.170R
# (tue_thu) and n=1 vs n=394 @ +0.231R (weekdays), cost-inclusive.
# NOT made adr_exempt: orb is a breakout like bos and arguably qualifies, but that
# variant is unmeasured — the numbers above keep the ADR gate ON. Follow-up, not a fix.

[strategy_params.inside_bar]
# inside_bar audit (2026-05-19, 13-sym pooled WFO): retires the crypto-era
# tp_r_long=4.0 / tp_r_short=2.0 directional override (BTC 1h / SOL 1h derived).
# 13-sym cohort flips the directional polarity — shorts drive 4h edge, longs
# drive 1d/1wk edge. Per-(tf, dir) commits now live in signal_watch{,_weekdays}.toml.

[strategy_params.marubozu]
volume_suppress = false       # A14b: low-vol edge Δ=-0.43R
