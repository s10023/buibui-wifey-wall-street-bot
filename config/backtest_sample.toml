# Backtest sweep — sample configuration
# Run with: buibui backtest --config config/backtest_sample.toml

symbols    = ["BTCUSDT", "ETHUSDT", "SOLUSDT"]
timeframes = ["1h", "4h", "1d"]
strategies = ["fvg", "bos", "liquidity_sweep", "eqh_eql", "wick_fill"]
days       = 90
sl_pct     = 0.02
# atr_sl_multiplier = 2.0  # ATR-based SL: SL distance = N × ATR14; overrides sl_pct when set
# atr_sl_multiplier_values = [0.5, 1.0, 1.5, 2.0, 2.5]  # sweep: comparison table across multipliers (like tp_r_values)
tp_r       = 2.0
fee_pct    = 0.0005   # 0.05% taker fee; set 0.0 to disable
min_trades = 20         # global fallback
# Per-TF overrides — calibrated for 90d window (scale ×200/90 from the 200d baselines).
# Formula: days × candles_per_day × signal_rate (1h=24/d, 4h=6, 1d=1)
min_trades_1h = 15
min_trades_4h = 5
min_trades_1d = 3
# save_results = true   # persist results to backtest_runs table in analytics.db
# tp_r_values = [1.0, 1.5, 2.0, 2.5, 3.0]  # TP ratio sweep — prints comparison table instead of ranked sweep
# liq_sweep_use_fib = true  # set false to compare pivot-sweep mode vs fib-extension mode
# liq_sweep_fib_range_close = false  # (fib mode only) true = close must be < swing_high (inside range), not just < fib level

