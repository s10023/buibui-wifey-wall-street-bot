# Signal Watch — default equity configuration (Tue–Thu only)
# Usage: make buibui-signal-watch CONFIG=config/signal_watch.toml
#
# CLI flags always take precedence over values here.
# Inherits: bias, backtest defaults, and consistent per-strategy flags
# from strategy_params.toml. Only tue_thu-specific values are defined here.
#
# T13 (2026-05-17): rewritten for equities. Symbols come from config/stocks.json
# (omit the `symbols` key below). Timeframes restricted to 4h | 1d | 1wk —
# yfinance free tier caps 1h history at ~730d and lower TFs at 60d, so 15m / 1h
# are out for Phase A.
#
# T14 (2026-05-17): WFO sweep on AAPL × 4h/1d (since 2024-05-16 / 2023-01-03,
# day_filter=tue_thu, fee_pct=0.0). 6 tp_r values updated where AAPL showed
# OOS edge (ema/engulfing 4h, morning_evening_star 4h, doji/trend_day/order_block
# 1d). Strategies marked "T14 AAPL: no_edge; multi-symbol pending" still carry
# crypto-era values until a 4-symbol or 13-symbol WFO runs.
#
# T-A (2026-05-18): 4-symbol pooled-trades WFO (AAPL+MSFT+SPY+QQQ) closes out
# the "multi-symbol pending" markers from T14. Pooling rule: per tp_r, concat
# OOS closed_trades across symbols → pick tp_r with the highest pooled OOS
# avg_r subject to pooled_n ≥ 10. Cells where no tp_r reaches positive pooled
# avg_r are kept at current value and retagged "no_edge confirmed".
#
# Task C (2026-05-18): /atr-sweep on liquidity_sweep × 4-sym cohort × 4h+1d+1wk
# × [0.5,1.0,1.5,2.0,2.5] × since 2023-01-03 × --atr-sl-floor on. Result: net
# negative at every multiplier on every TF — committed least-bad multipliers
# (4h=2.0×, 1d=0.5×) plus per-strategy `atr_sl_floor = true` under
# [strategy_params.liquidity_sweep]. Top-level atr_sl_floor stays off so no
# other strategy sees a behavior change. Other strategies' ATR floors are
# still owed a /atr-sweep follow-up.
#
# Task E (2026-05-19): full 13-symbol watchlist (AAPL/MSFT/GOOGL/AMZN/META/ORCL/
# ADBE/NVDA/AMD/TSLA/MSTR/SPY/QQQ) pooled-trades WFO across Task A directional
# cells AND T-A combined cells. Decision rule (additive): pooled_n ≥ 10 per
# direction AND avg_r > 0 — commit combined per-TF; ADDITIONALLY commit
# tp_r_long_<tf> / tp_r_short_<tf> when that direction's winner differs from
# combined. 13-sym roughly 3.25× the trade count vs T-A 4-sym, reopening cells
# Task A's strict rule had to skip (e.g. trend_day 1wk directional). Some
# Task A directional commits revert to combined under 13-sym where the wider
# cohort dilutes single-symbol edges. fib_golden_zone 4h confirmed no_edge —
# tp_r_4h dropped, fallback retained.
#
# inside_bar audit (2026-05-19): retires crypto tp_r_long=4.0/tp_r_short=2.0
# leak in strategy_params.toml (was directionally backwards — 13-sym shows
# shorts drive 4h, longs drive 1d/1wk). 6-cell 13-sym pooled WFO refreshed all
# inside_bar entries; 1wk tue_thu n<10 falls back to tp_r=3.0. Stale crypto
# lines dropped.
#
# Task C-followup (2026-05-20): /atr-sweep extended from liquidity_sweep (Task C
# 4-sym) to ALL active strategies × 13-sym × 4h+1d+1wk × [0.5,1.0,1.5,2.0,2.5]
# × since 2023-01-03 × --atr-sl-floor on. Per-strategy `atr_sl_floor = true`
# + `atr_sl_multiplier_<tf>` committed under each [strategy_params.X] block
# (top-level floor still off). 1wk rows all n/a on tue_thu (Fri close × tue_thu
# suppression — same dead-cell class as Task C / pin_bar audit). Decision rule:
# pick column where avg R peaks; commit least-bad when all multipliers net-neg
# (Task C precedent); skip cells with n<10. 13-sym revises Task C 4-sym
# liquidity_sweep finding: 4h winner flips 2.0×→0.5×. Reminder: tp_r values
# were calibrated WITHOUT the ATR floor — a tp_r re-sweep at the committed
# multipliers is the natural follow-up but deferred to a future task.

extends = "strategy_params.toml"

# Symbols to watch — omit to use the full watchlist from config/stocks.json.
# symbols = ["AAPL", "MSFT"]

timeframes = ["4h", "1d", "1wk"]

# Suppress signals by day: "off" | "weekdays" (Mon–Fri) | "tue_thu" (Tue–Thu only)
# "tue_thu" suppresses Mon and Fri (ICT weekly cycle — manipulation/distribution days)
day_filter = "tue_thu"

# Strategies to run
strategies = [
    'orb',
    'liquidity_sweep',
    'bos',
    'eqh_eql',
    'order_block',
    'trend_day',
    'engulfing',
    'pin_bar',
    'inside_bar',
    'hammer_hanging_man',
    'doji',
    'morning_evening_star',
    'fib_golden_zone',
    'ema'
]

# SL/TP defaults
# sl_pct = 0.02
# atr_sl_multiplier = 2.0  # ATR-based SL: SL distance = N × ATR14; overrides sl_pct when set
# atr_sl_multiplier_values = [0.5, 1.0, 1.5, 2.0, 2.5]  # sweep: comparison table across multipliers
# tp_r_values = [1.5, 2.0, 2.5, 3.0, 3.5, 4.0, 4.5, 5.0]  # TP ratio sweep
# tp_r = 2.0

# Cooldown between same (symbol, strategy, direction) alerts, in seconds
# cooldown_seconds = 3600

# Per-strategy timeframe allow-list.
# Strategies listed here are restricted to the specified TFs.
# Strategies not listed run on all configured timeframes.
# T13: ORB mechanically requires range_candles + 1 bars per session — on US RTH
# 4h synth (13:30 + 17:30) each session has exactly 2 bars, so ORB is 4h-only.
# Daily / weekly sessions hold a single candle and cannot form an opening range.
# Other restrictions deferred to T14 (equity WFO recalibration).
[strategy_timeframes]
orb = ["4h"]                                # T13: mechanical — 4h is the only equity TF with ≥2 bars per session

# Per-strategy parameter overrides — tp_r and sl_pct.
# Lookup order: TF-specific key (e.g. tp_r_4h) → strategy-wide tp_r → global tp_r.
# T13: TF-15m / TF-1h overrides stripped (TFs dropped). Per-symbol BTC/ETH/SOL
# overrides stripped (crypto symbols out of scope). 4h/1d crypto-derived values
# kept as a starting guess; T14 WFO overwrites with equity-derived numbers.
[strategy_params.engulfing]
tp_r = 3.0                    # fallback
tp_r_4h = 2.5                 # Task E 13-sym: combined 2.5@+0.226R, n=190 (supersedes T-A 4-sym 3.0)
tp_r_1d = 2.5                 # Task E 13-sym: combined 2.5@+0.234R, n=137
tp_r_long_1d = 4.0            # Task E 13-sym directional: longs +0.533R, n=60 at 4.0 (was 3.5)
tp_r_short_1d = 1.5           # Task E 13-sym directional: shorts +0.201R, n=77 at 1.5 (was 2.5)
atr_sl_floor = true           # Task C-followup 13-sym: ATR floor on (structural SL widened to N × ATR14 when tighter)
atr_sl_multiplier_4h = 0.5    # Task C-followup 13-sym: +0.21R, n=370
atr_sl_multiplier_1d = 1.0    # Task C-followup 13-sym: -0.12R least-bad, n=312

[strategy_params.pin_bar]
tp_r = 3.0                    # fallback (also covers 1wk: pin_bar audit 13-sym n=0 — Fri close × tue_thu suppression)
tp_r_4h = 3.5                 # pin_bar audit 13-sym: combined 3.5@+0.256R, n=227 (confirmed; long=short=combined)
tp_r_1d = 3.5                 # pin_bar audit 13-sym: combined 3.5@+0.184R, n=179 (confirmed; long/short diverge — directional overrides below)
tp_r_long_1d = 5.0            # pin_bar audit 13-sym directional: longs +0.219R, n=105 at 5.0
tp_r_short_1d = 2.5           # pin_bar audit 13-sym directional: shorts +0.218R, n=71 at 2.5
atr_sl_floor = true           # Task C-followup 13-sym: ATR floor on
atr_sl_multiplier_4h = 1.5    # Task C-followup 13-sym: +0.14R, n=761
atr_sl_multiplier_1d = 0.5    # Task C-followup 13-sym: +0.24R, n=586

[strategy_params.hammer_hanging_man]
tp_r = 4.0                    # fallback (crypto cross-symbol)
tp_r_1d = 2.5                 # T-A 4-sym WFO OOS: +0.288R, n=33 (was 3.0)
atr_sl_floor = true           # Task C-followup 13-sym: ATR floor on
atr_sl_multiplier_4h = 1.5    # Task C-followup 13-sym: -0.01R least-bad (tied 1.0/1.5), n=433
atr_sl_multiplier_1d = 1.0    # Task C-followup 13-sym: -0.06R least-bad, n=336

[strategy_params.doji]
tp_r = 3.0                    # fallback
tp_r_1d = 2.5                 # T14 AAPL WFO OOS: +0.313R, n=8 (2026-05-17)
volume_suppress = true        # A14b crypto finding; T14 AAPL volume split not re-tested
atr_sl_floor = true           # Task C-followup 13-sym: ATR floor on
atr_sl_multiplier_4h = 0.5    # Task C-followup 13-sym: +0.20R, n=40
atr_sl_multiplier_1d = 2.5    # Task C-followup 13-sym: +0.29R, n=20

[strategy_params.inside_bar]
tp_r = 3.0                    # fallback (also covers 1wk: inside_bar audit 13-sym n<10 — insufficient sample)
tp_r_4h = 3.0                 # inside_bar audit 13-sym: combined 3.0@+0.108R, n=195 (was 3.5; shorts drive — long no_edge)
tp_r_1d = 2.0                 # inside_bar audit 13-sym: combined 2.0@+0.063R, n=142 (new; thin combined, long drives)
tp_r_long_1d = 5.0            # inside_bar audit 13-sym directional: longs +0.354R, n=65 at 5.0 (short no_edge → falls to combined 2.0)
atr_sl_floor = true           # Task C-followup 13-sym: ATR floor on
atr_sl_multiplier_4h = 0.5    # Task C-followup 13-sym: +0.19R, n=629
atr_sl_multiplier_1d = 1.0    # Task C-followup 13-sym: +0.07R, n=497

[strategy_params.morning_evening_star]
tp_r = 3.0                    # fallback
tp_r_4h = 2.5                 # Task E 13-sym: combined 2.5@+0.137R, n=252 (was 3.5)
tp_r_long_4h = 5.0            # Task E 13-sym directional: longs +0.155R, n=116 at 5.0
tp_r_short_4h = 3.5           # Task E 13-sym directional: shorts +0.162R, n=130 at 3.5
tp_r_1d = 2.5                 # Task E 13-sym: combined 2.5@+0.091R, n=208
tp_r_long_1d = 5.0            # Task E 13-sym directional: longs +0.361R, n=97 at 5.0 (kept from Task A)
tp_r_short_1d = 2.0           # Task E 13-sym directional: shorts +0.081R, n=111 at 2.0
atr_sl_floor = true           # Task C-followup 13-sym: ATR floor on
atr_sl_multiplier_4h = 1.0    # Task C-followup 13-sym: +0.15R, n=815
atr_sl_multiplier_1d = 1.0    # Task C-followup 13-sym: +0.10R, n=683

[strategy_params.fib_golden_zone]
# Task E 13-sym: 4h no_edge confirmed (best -0.030R) — tp_r_4h dropped, fallback retained
adr_exempt = true             # BOS + retracement pullback entry — continuation strategy
volume_suppress = true        # A14b crypto finding; T14 AAPL volume split not re-tested
atr_sl_floor = true           # Task C-followup 13-sym: ATR floor on (removal candidate)
atr_sl_multiplier_4h = 2.5    # Task C-followup 13-sym: +0.14R, n=21 (others +0.00; structural SL wider than floor at lower multipliers)
atr_sl_multiplier_1d = 2.0    # Task C-followup 13-sym: +0.20R, n=15 (others +0.00; thin sample)

[strategy_params.bos]
tp_r = 3.0                    # T-A 4-sym: 4h no_edge confirmed (best -0.143R); 1d edge +0.481R at tp_r=3.0 (n=27) — combined value retained
adr_exempt = true             # breakout — fires in continuation direction; ADR gate degrades it
atr_sl_floor = true           # Task C-followup 13-sym: ATR floor on
atr_sl_multiplier_4h = 2.0    # Task C-followup 13-sym: -0.29R least-bad (tied 0.5/1.0/2.0), n=153
atr_sl_multiplier_1d = 2.0    # Task C-followup 13-sym: +0.04R, n=85

[strategy_params.trend_day]
tp_r = 3.0                    # fallback
tp_r_4h = 4.5                 # Task E 13-sym confirms: combined 4.5@+0.252R, n=451
tp_r_long_4h = 5.0            # Task E 13-sym directional: longs +0.305R, n=187 at 5.0
tp_r_short_4h = 2.0           # Task E 13-sym directional: shorts +0.307R, n=264 at 2.0
tp_r_long_1d = 5.0            # Task E 13-sym directional: longs +0.571R, n=163 at 5.0 (kept from Task A; Δ=0.505R)
tp_r_short_1d = 3.0           # Task E 13-sym directional: shorts +0.066R, n=212 at 3.0 (was 3.5)
atr_sl_floor = true           # Task C-followup 13-sym: ATR floor on
atr_sl_multiplier_4h = 0.5    # Task C-followup 13-sym: +0.16R, n=1508
atr_sl_multiplier_1d = 1.0    # Task C-followup 13-sym: +0.16R, n=1380

[strategy_params.orb]
tp_r = 3.0                    # fallback
tp_r_4h = 3.5                 # T-A 4-sym WFO OOS: +0.300R, n=100 (was 5.0)
atr_sl_floor = true           # Task C-followup 13-sym: ATR floor on
atr_sl_multiplier_4h = 1.5    # Task C-followup 13-sym: +0.17R (tied 0.5/1.0/1.5), n=77

[strategy_params.eqh_eql]
