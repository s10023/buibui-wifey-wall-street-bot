# Signal Watch — default equity configuration (Tue–Thu only)
# Usage: make buibui-signal-watch CONFIG=config/signal_watch.toml
#
# CLI flags always take precedence over values here.
# Inherits: bias, backtest defaults, and consistent per-strategy flags
# from strategy_params.toml. Only tue_thu-specific values are defined here.
#
# T13 (2026-05-17): rewritten for equities. Symbols come from config/stocks.json
# (omit the `symbols` key below). Timeframes restricted to 4h | 1d | 1wk —
# yfinance free tier caps 1h history at ~730d and lower TFs at 60d, so 15m / 1h
# are out for Phase A.
#
# T14 (2026-05-17): WFO sweep on AAPL × 4h/1d (since 2024-05-16 / 2023-01-03,
# day_filter=tue_thu, fee_pct=0.0). 6 tp_r values updated where AAPL showed
# OOS edge (ema/engulfing 4h, morning_evening_star 4h, doji/trend_day/order_block
# 1d). Strategies marked "T14 AAPL: no_edge; multi-symbol pending" still carry
# crypto-era values until a 4-symbol or 13-symbol WFO runs.

extends = "strategy_params.toml"

# Symbols to watch — omit to use the full watchlist from config/stocks.json.
# symbols = ["AAPL", "MSFT"]

timeframes = ["4h", "1d", "1wk"]

# Suppress signals by day: "off" | "weekdays" (Mon–Fri) | "tue_thu" (Tue–Thu only)
# "tue_thu" suppresses Mon and Fri (ICT weekly cycle — manipulation/distribution days)
day_filter = "tue_thu"

# Strategies to run
strategies = [
    'orb',
    'liquidity_sweep',
    'bos',
    'eqh_eql',
    'order_block',
    'trend_day',
    'engulfing',
    'pin_bar',
    'inside_bar',
    'hammer_hanging_man',
    'doji',
    'morning_evening_star',
    'fib_golden_zone',
    'ema'
]

# SL/TP defaults
# sl_pct = 0.02
# atr_sl_multiplier = 2.0  # ATR-based SL: SL distance = N × ATR14; overrides sl_pct when set
# atr_sl_multiplier_values = [0.5, 1.0, 1.5, 2.0, 2.5]  # sweep: comparison table across multipliers
# tp_r_values = [1.5, 2.0, 2.5, 3.0, 3.5, 4.0, 4.5, 5.0]  # TP ratio sweep
# tp_r = 2.0

# Cooldown between same (symbol, strategy, direction) alerts, in seconds
# cooldown_seconds = 3600

# Per-strategy timeframe allow-list.
# Strategies listed here are restricted to the specified TFs.
# Strategies not listed run on all configured timeframes.
# T13: ORB mechanically requires range_candles + 1 bars per session — on US RTH
# 4h synth (13:30 + 17:30) each session has exactly 2 bars, so ORB is 4h-only.
# Daily / weekly sessions hold a single candle and cannot form an opening range.
# Other restrictions deferred to T14 (equity WFO recalibration).
[strategy_timeframes]
orb = ["4h"]                                # T13: mechanical — 4h is the only equity TF with ≥2 bars per session

# Per-strategy parameter overrides — tp_r and sl_pct.
# Lookup order: TF-specific key (e.g. tp_r_4h) → strategy-wide tp_r → global tp_r.
# T13: TF-15m / TF-1h overrides stripped (TFs dropped). Per-symbol BTC/ETH/SOL
# overrides stripped (crypto symbols out of scope). 4h/1d crypto-derived values
# kept as a starting guess; T14 WFO overwrites with equity-derived numbers.
[strategy_params.engulfing]
tp_r = 3.0                    # fallback
tp_r_4h = 3.0                 # T14 AAPL WFO OOS: +0.250R, n=16 (2026-05-17, equity-confirmed)

[strategy_params.pin_bar]
tp_r = 3.0                    # fallback
tp_r_4h = 4.5                 # T14 AAPL: no_edge; multi-symbol pending
tp_r_1d = 4.0                 # T14 AAPL: no_edge; multi-symbol pending

[strategy_params.hammer_hanging_man]
tp_r = 4.0                    # fallback (crypto cross-symbol)
tp_r_1d = 3.0                 # T14 AAPL: no_edge; multi-symbol pending

[strategy_params.doji]
tp_r = 3.0                    # fallback
tp_r_1d = 2.5                 # T14 AAPL WFO OOS: +0.313R, n=8 (2026-05-17)
volume_suppress = true        # A14b crypto finding; T14 AAPL volume split not re-tested

[strategy_params.inside_bar]
tp_r = 3.0                    # fallback
tp_r_4h = 3.5                 # T14 AAPL: no_edge; multi-symbol pending

[strategy_params.morning_evening_star]
tp_r = 3.0                    # fallback for 1d (T14 AAPL 1d: all configs OVERFIT, kept current)
tp_r_4h  = 2.0                # T14 AAPL WFO OOS: +0.143R, n=21 (2026-05-17, was 5.0 crypto peak)

[strategy_params.fib_golden_zone]
tp_r_4h = 3.5                 # T14 AAPL: no_data (no signals fired OOS); multi-symbol pending
adr_exempt = true             # BOS + retracement pullback entry — continuation strategy
volume_suppress = true        # A14b crypto finding; T14 AAPL volume split not re-tested

[strategy_params.bos]
tp_r = 3.0                    # T14 AAPL: no_edge; multi-symbol pending
adr_exempt = true             # breakout — fires in continuation direction; ADR gate degrades it

[strategy_params.trend_day]
tp_r = 3.0                    # fallback
tp_r_4h = 3.5                 # T14 AAPL: no_edge; multi-symbol pending
tp_r_1d = 3.0                 # T14 AAPL WFO OOS: +0.524R, n=21 (2026-05-17, was 4.5 crypto peak)

[strategy_params.orb]
tp_r = 3.0                    # fallback
tp_r_4h = 5.0                 # T14 AAPL: no_edge; multi-symbol pending

[strategy_params.eqh_eql]
adr_exempt = true             # liquidity sweep — fires at structure extremes in continuation direction

[strategy_params.ema]
tp_r = 3.0                    # spec §6 default
tp_r_4h = 4.0                 # T14 AAPL WFO OOS: +0.667R, n=9 (2026-05-17)

[strategy_params.order_block]
tp_r_1d = 5.0                 # T14 AAPL WFO OOS: +0.294R, n=17 (2026-05-17)

[strategy_params.liquidity_sweep]
# T14 AAPL: no_edge; atr_sl_floor / atr_sl_multiplier inherited as crypto-calibrated, multi-symbol pending

# backtest and bias sections live in strategy_params.toml (base).
# Uncomment below to override specific backtest options for this config:
# [backtest]
# save_results = true
# volume_suppress = false
