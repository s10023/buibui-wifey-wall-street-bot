tp_r_4h = 2.5                 # Task E 13-sym: combined 2.5@+0.424R, n=85 (was 4.0)
tp_r_long_4h = 5.0            # Task E 13-sym directional: longs +0.517R, n=29 at 5.0
tp_r_short_4h = 4.5           # Task E 13-sym directional: shorts +0.402R, n=51 at 4.5
tp_r_long_1d = 5.0            # Task E 13-sym directional: longs +1.483R, n=29 at 5.0 (kept from Task A)
tp_r_short_1d = 4.0           # Task E 13-sym directional: shorts +0.448R, n=29 at 4.0 (Δ=1.035R)
atr_sl_floor = true           # Task C-followup 13-sym: ATR floor on
atr_sl_multiplier_4h = 2.5    # Task C-followup 13-sym: +0.27R, n=266
atr_sl_multiplier_1d = 0.5    # Task C-followup 13-sym: +0.39R, n=216

[strategy_params.order_block]
tp_r_1d = 5.0                 # T14 AAPL WFO OOS: +0.294R, n=17 (2026-05-17)
atr_sl_floor = true           # Task C-followup 13-sym: ATR floor on
atr_sl_multiplier_4h = 0.5    # Task C-followup 13-sym: -0.01R least-bad, n=803
atr_sl_multiplier_1d = 2.5    # Task C-followup 13-sym: +0.16R, n=774

[strategy_params.liquidity_sweep]
# Task C ATR sweep (2026-05-18, /atr-sweep liquidity_sweep × 4-sym cohort) found
# net negative at every multiplier on every TF; committed 4h=2.0×, 1d=0.5×.
# Task C-followup (2026-05-20, 13-sym cohort) revises 4h: best tt -0.18R @ 0.5×
# (was -0.14R @ 2.0× on 4-sym — winner flips). 1d 0.5× confirmed (-0.06R least-
# bad). 1wk still 0 signals on tue_thu (Fri close × tue_thu suppression).
# Strategy is still net negative on this cohort at every TF — values minimize
# loss, do not deliver edge. Removal candidate if live cofiring gates don't
# rescue it.
atr_sl_floor = true           # Task C: ATR floor on; widens tight structural SLs to N × ATR14
atr_sl_multiplier_4h = 0.5    # Task C-followup 13-sym: -0.18R least-bad (was 2.0× on 4-sym; 13-sym flips winner), n=150
atr_sl_multiplier_1d = 0.5    # Task C-followup 13-sym: -0.06R least-bad (confirms Task C 4-sym 0.5×), n=67
# 1wk: no commit — 0 signals on tue_thu (Fri close × tue_thu suppression)

