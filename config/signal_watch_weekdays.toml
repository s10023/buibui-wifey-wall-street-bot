# Signal Watch — weekdays equity profile (Mon–Fri, no weekend signals)
# Usage: make buibui-signal-watch CONFIG=config/signal_watch_weekdays.toml
#
# Inherits: bias, backtest defaults, and consistent per-strategy flags
# from strategy_params.toml. Only weekdays-specific values are defined here.
#
# T13 (2026-05-17): rewritten for equities. Symbols come from config/stocks.json
# (omit `symbols`). Timeframes restricted to 4h | 1d | 1wk.
#
# T14 (2026-05-17): WFO sweep on AAPL × 4h/1d with day_filter=weekdays
# (since 2024-05-16 / 2023-01-03, fee_pct=0.0). 9 tp_r values updated where
# AAPL showed OOS edge under the wider weekdays trade population (more
# candidates survived audit than the tue_thu config). Strategies marked
# "T14 AAPL: no_edge; multi-symbol pending" still carry crypto-era values
# until a 4-symbol or 13-symbol WFO runs.

extends = "strategy_params.toml"

# Symbols to watch — omit to use the full watchlist from config/stocks.json.
# symbols = ["AAPL", "MSFT"]

timeframes = ["4h", "1d", "1wk"]

# Suppress signals by day: "off" | "weekdays" (Mon–Fri) | "tue_thu" (Tue–Thu only)
day_filter = "weekdays"

strategies = [
    'orb',
    'liquidity_sweep',
    'bos',
    'eqh_eql',
    'order_block',
    'trend_day',
    'engulfing',
    'pin_bar',
    'inside_bar',
    'hammer_hanging_man',
    'doji',
    'morning_evening_star',
    'fib_golden_zone',
    'ema'
]

# atr_sl_multiplier = 2.0  # ATR-based SL: SL distance = N × ATR14; overrides sl_pct when set
# atr_sl_multiplier_values = [0.5, 1.0, 1.5, 2.0, 2.5]
# tp_r_values = [1.5, 2.0, 2.5, 3.0, 3.5, 4.0, 4.5, 5.0]

# T13: see signal_watch.toml — ORB is 4h-only on equity by mechanic.
[strategy_timeframes]
orb = ["4h"]

# Per-strategy overrides — T14 (2026-05-17) WFO on AAPL day_filter=weekdays.
[strategy_params.engulfing]
tp_r = 3.5                    # fallback
tp_r_4h = 5.0                 # T14 AAPL WFO OOS: +0.429R, n=21 (was 3.5)

[strategy_params.pin_bar]
tp_r = 3.5                    # fallback
tp_r_4h = 3.5                 # T14 AAPL: no_edge; multi-symbol pending
tp_r_1d = 4.0                 # T14 AAPL WFO OOS: +0.207R, n=29 (was 3.5)

[strategy_params.hammer_hanging_man]
tp_r = 4.0                    # fallback
tp_r_4h = 4.0                 # T14 AAPL: no_edge; multi-symbol pending

[strategy_params.doji]
tp_r = 3.0                    # fallback (T14 AAPL: marginal only, kept current)
volume_suppress = true        # A14b crypto finding; T14 AAPL volume split not re-tested

[strategy_params.inside_bar]
tp_r = 3.0                    # fallback
tp_r_4h = 3.5                 # T14 AAPL WFO OOS: +0.452R, n=31 (equity-confirmed)
tp_r_1d = 2.5                 # T14 AAPL WFO OOS: +0.353R, n=17 (new)

[strategy_params.eqh_eql]
tp_r_4h = 2.0                 # T14 AAPL WFO OOS: +0.385R, n=13 (new)
tp_r_1d = 2.0                 # T14 AAPL: no_edge at 1d; multi-symbol pending

[strategy_params.fib_golden_zone]
tp_r_4h = 3.5                 # T14 AAPL: no_edge; multi-symbol pending
tp_r_1d = 3.5                 # T14 AAPL: no_edge; multi-symbol pending

[strategy_params.bos]
tp_r = 3.0                    # T14 AAPL: no_edge; multi-symbol pending

[strategy_params.trend_day]
tp_r_4h = 3.5                 # T14 AAPL: no_edge; multi-symbol pending
tp_r_1d = 3.0                 # T14 AAPL WFO OOS: +0.659R, n=41 (was 4.0)

[strategy_params.orb]
tp_r_4h = 5.0                 # T14 AAPL: no_edge; multi-symbol pending

[strategy_params.liquidity_sweep]
tp_r_1d = 5.0                 # T14 AAPL WFO OOS: +0.231R, n=13 (was 3.5)

[strategy_params.morning_evening_star]
tp_r_4h = 2.5                 # T14 AAPL WFO OOS: +0.375R, n=32 (was 5.0)
tp_r_1d = 4.0                 # T14 AAPL: no_edge at 1d; multi-symbol pending

[strategy_params.order_block]
tp_r_1d = 3.0                 # T14 AAPL WFO OOS: +0.630R, n=27 (was 1.5)

[strategy_params.ema]
tp_r = 3.0                    # spec §6 default; T14 AAPL 4h: no_edge; multi-symbol pending

# backtest and bias sections live in strategy_params.toml (base).
# Uncomment below to override specific backtest options for this config:
# [backtest]
# save_results = true
# volume_suppress = false
