# Signal Watch — weekdays equity profile (Mon–Fri, no weekend signals)
# Usage: make buibui-signal-watch CONFIG=config/signal_watch_weekdays.toml
#
# Inherits: bias, backtest defaults, and consistent per-strategy flags
# from strategy_params.toml. Only weekdays-specific values are defined here.
#
# T13 (2026-05-17): rewritten for equities. Symbols come from config/stocks.json
# (omit `symbols`). Timeframes restricted to 4h | 1d | 1wk. tp_r values
# inherited from the crypto era are a starting guess; T14 (WFO + recalibrate)
# replaces them with equity-derived numbers.

extends = "strategy_params.toml"

# Symbols to watch — omit to use the full watchlist from config/stocks.json.
# symbols = ["AAPL", "MSFT"]

timeframes = ["4h", "1d", "1wk"]

# Suppress signals by day: "off" | "weekdays" (Mon–Fri) | "tue_thu" (Tue–Thu only)
day_filter = "weekdays"

strategies = [
    'orb',
    'liquidity_sweep',
    'bos',
    'eqh_eql',
    'order_block',
    'trend_day',
    'engulfing',
    'pin_bar',
    'inside_bar',
    'hammer_hanging_man',
    'doji',
    'morning_evening_star',
    'fib_golden_zone',
    'ema'
]

# atr_sl_multiplier = 2.0  # ATR-based SL: SL distance = N × ATR14; overrides sl_pct when set
# atr_sl_multiplier_values = [0.5, 1.0, 1.5, 2.0, 2.5]
# tp_r_values = [1.5, 2.0, 2.5, 3.0, 3.5, 4.0, 4.5, 5.0]

# T13: see signal_watch.toml — ORB is 4h-only on equity by mechanic.
[strategy_timeframes]
orb = ["4h"]

# Per-strategy overrides — crypto-derived starting guess; T14 recalibrates.
[strategy_params.engulfing]
tp_r = 3.5                    # was crypto cross-symbol; revisit in T14
tp_r_4h = 3.5                 # revisit in T14

[strategy_params.pin_bar]
tp_r = 3.5                    # fallback
tp_r_4h = 3.5                 # revisit in T14
tp_r_1d = 3.5                 # revisit in T14

[strategy_params.hammer_hanging_man]
tp_r = 4.0                    # fallback
tp_r_4h = 4.0                 # revisit in T14

[strategy_params.doji]
tp_r = 3.0                    # fallback
volume_suppress = true        # A14b crypto finding; revisit in T14

[strategy_params.inside_bar]
tp_r = 3.0                    # fallback
tp_r_4h = 3.5                 # revisit in T14

[strategy_params.eqh_eql]
tp_r_1d = 2.0                 # was crypto baseline; hard mode gates on noise. Revisit in T14.

[strategy_params.fib_golden_zone]
tp_r_4h = 3.5                 # revisit in T14
tp_r_1d = 3.5                 # revisit in T14

[strategy_params.bos]
tp_r = 3.0                    # was crypto-calibrated; revisit in T14

[strategy_params.trend_day]
tp_r_4h = 3.5                 # revisit in T14
tp_r_1d = 4.0                 # revisit in T14

[strategy_params.orb]
tp_r_4h = 5.0                 # was crypto TP sweep peak; revisit in T14

[strategy_params.liquidity_sweep]
tp_r_1d = 3.5                 # was crypto baseline; revisit in T14

[strategy_params.morning_evening_star]
tp_r_4h = 5.0                 # revisit in T14
tp_r_1d = 4.0                 # revisit in T14

[strategy_params.order_block]
tp_r_1d = 1.5                 # was crypto sweep peak; revisit in T14

[strategy_params.ema]
tp_r = 3.0                    # spec §6 default; tune per-TF after WFO sweep

# backtest and bias sections live in strategy_params.toml (base).
# Uncomment below to override specific backtest options for this config:
# [backtest]
# save_results = true
# volume_suppress = false
