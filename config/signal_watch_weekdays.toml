tp_r_4h = 3.0                 # candle-resweep 13-sym (under ATR floor 0.5×): combined 4.0@+0.052R is thin uplift vs 3.0@+0.036R (+0.016R) — keep Task E commit (status quo for sub-noise margins)
tp_r_short_4h = 2.5           # candle-resweep 13-sym: shorts +0.346R, n=156 at 2.5 (confirms Task E)
tp_r_1d = 2.5                 # candle-resweep 13-sym (under ATR floor 0.5×): combined 2.5@+0.239R, n=211 (confirms Task E)
tp_r_long_1d = 3.0            # candle-resweep 13-sym directional: longs +0.296R, n=108 at 3.0 (confirms Task E)
tp_r_1wk = 4.0                # candle-resweep 13-sym (under ATR floor 0.5×): NEW commit — combined 4.0@+0.066R, n=61 (replaces fallback 3.5 which was -0.041R under ATR floor)
tp_r_long_1wk = 5.0           # candle-resweep 13-sym directional: longs +0.250R, n=24 at 5.0 (NEW commit; thin sample but consistent positive across grid)
tp_r_short_1wk = 4.0          # candle-resweep 13-sym short-only: 4.0@+0.081R, n=37 (was 4.5; ATR floor pulled winner 0.5 step shorter)
atr_sl_floor = true           # Task C-followup 13-sym: ATR floor on (structural SL widened to N × ATR14 when tighter)
atr_sl_multiplier_4h = 0.5    # Task C-followup 13-sym: +0.06R, n=592
atr_sl_multiplier_1d = 0.5    # Task C-followup 13-sym: -0.14R least-bad, n=449
atr_sl_multiplier_1wk = 0.5   # Task C-followup 13-sym: -0.01R least-bad, n=118

