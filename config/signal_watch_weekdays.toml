# Signal Watch — weekdays equity profile (Mon–Fri, no weekend signals)
# Usage: make buibui-signal-watch CONFIG=config/signal_watch_weekdays.toml
#
# Inherits: bias, backtest defaults, and consistent per-strategy flags
# from strategy_params.toml. Only weekdays-specific values are defined here.
#
# T13 (2026-05-17): rewritten for equities. Symbols come from config/stocks.json
# (omit `symbols`). Timeframes restricted to 4h | 1d | 1wk.
#
# T14 (2026-05-17): WFO sweep on AAPL × 4h/1d with day_filter=weekdays
# (since 2024-05-16 / 2023-01-03, fee_pct=0.0). 9 tp_r values updated where
# AAPL showed OOS edge under the wider weekdays trade population (more
# candidates survived audit than the tue_thu config). Strategies marked
# "T14 AAPL: no_edge; multi-symbol pending" still carry crypto-era values
# until a 4-symbol or 13-symbol WFO runs.
#
# T-A (2026-05-18): 4-symbol pooled-trades WFO (AAPL+MSFT+SPY+QQQ) closes out
# the "multi-symbol pending" markers from T14. Per tp_r, OOS closed_trades are
# concat'd across symbols → pick the tp_r with the highest pooled OOS avg_r
# subject to pooled_n ≥ 10. Cells with no positive pooled tp_r are kept at
# current value and retagged "no_edge confirmed".
#
# Task C (2026-05-18): /atr-sweep on liquidity_sweep × 4-sym cohort × 4h+1d+1wk
# × [0.5,1.0,1.5,2.0,2.5] × since 2023-01-03 × --atr-sl-floor on. Result: net
# negative at every multiplier on every TF — committed least-bad multipliers
# (4h=2.0×, 1d=0.5×) plus per-strategy `atr_sl_floor = true` under
# [strategy_params.liquidity_sweep]. Top-level atr_sl_floor stays off so no
# other strategy sees a behavior change. Other strategies' ATR floors are
# still owed a /atr-sweep follow-up.
#
# Task E (2026-05-19): full 13-symbol watchlist pooled-trades WFO across Task A
# directional cells AND T-A combined cells. Decision rule (additive): pooled_n
# ≥ 10 per direction AND avg_r > 0 — commit combined per-TF; ADDITIONALLY
# commit tp_r_long_<tf> / tp_r_short_<tf> when that direction's winner
# differs from combined. 13-sym roughly 3.25× the trade count vs T-A 4-sym,
# reopening 1wk cells Task A's strict rule had to skip (engulfing short-only,
# trend_day directional, morning_evening_star long-only). Several Task A
# 4-sym directional commits revert to combined under 13-sym where wider
# cohort dilutes single-symbol edges.
#
# inside_bar audit (2026-05-19): retires crypto tp_r_long=4.0/tp_r_short=2.0
# leak in strategy_params.toml (was directionally backwards — 13-sym shows
# shorts drive 4h, longs drive 1d/1wk). 6-cell 13-sym pooled WFO refreshed all
# inside_bar entries; first-ever tp_r_1wk commit. Stale crypto lines dropped.
#
# Task C-followup (2026-05-20): /atr-sweep extended from liquidity_sweep (Task C
# 4-sym) to ALL active strategies × 13-sym × 4h+1d+1wk × [0.5,1.0,1.5,2.0,2.5]
# × since 2023-01-03 × --atr-sl-floor on. Per-strategy `atr_sl_floor = true` +
# `atr_sl_multiplier_<tf>` committed under each [strategy_params.X] block
# (top-level floor still off). 1wk rows have data on weekdays (Fri included).
# Decision rule: pick column where avg R peaks; commit least-bad when all
# multipliers net-neg (Task C precedent); skip cells with n<10. 13-sym revises
# Task C 4-sym liquidity_sweep finding: 4h winner flips 2.0×→0.5×, 1d 0.5×→1.5×,
# 1wk gets first commit at 1.5×. Reminder: tp_r values were calibrated WITHOUT
# the ATR floor — a tp_r re-sweep at the committed multipliers is the natural
# follow-up but deferred to a future task.
#
# liquidity_sweep removal (2026-05-21): full prune. 4h/1d net-neg both configs;
# only 1wk weekdays +0.17R n=23 was positive. 0 combo usage in
# backtest_combos / backtest_cross_tf_combos pre-check.

extends = "strategy_params.toml"

# Symbols to watch — omit to use the full watchlist from config/stocks.json.
# symbols = ["AAPL", "MSFT"]

timeframes = ["4h", "1d", "1wk"]

# Suppress signals by day: "off" | "weekdays" (Mon–Fri) | "tue_thu" (Tue–Thu only)
day_filter = "weekdays"

strategies = [
    'orb',
    'bos',
    'eqh_eql',
    'order_block',
    'trend_day',
    'engulfing',
    'pin_bar',
    'inside_bar',
    'hammer_hanging_man',
    'doji',
    'morning_evening_star',
    'ema'
]

# atr_sl_multiplier = 2.0  # ATR-based SL: SL distance = N × ATR14; overrides sl_pct when set
# atr_sl_multiplier_values = [0.5, 1.0, 1.5, 2.0, 2.5]
# tp_r_values = [1.5, 2.0, 2.5, 3.0, 3.5, 4.0, 4.5, 5.0]

# T13: see signal_watch.toml — ORB is 4h-only on equity by mechanic.
[strategy_timeframes]
orb = ["4h"]

# Per-strategy overrides — T14 (2026-05-17) WFO on AAPL day_filter=weekdays.
