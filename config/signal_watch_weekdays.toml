# Signal Watch — weekdays equity profile (Mon–Fri, no weekend signals)
# Usage: make buibui-signal-watch CONFIG=config/signal_watch_weekdays.toml
#
# Inherits: bias, backtest defaults, and consistent per-strategy flags
# from strategy_params.toml. Only weekdays-specific values are defined here.
#
# T13 (2026-05-17): rewritten for equities. Symbols come from config/stocks.json
# (omit `symbols`). Timeframes restricted to 4h | 1d | 1wk.
#
# T14 (2026-05-17): WFO sweep on AAPL × 4h/1d with day_filter=weekdays
# (since 2024-05-16 / 2023-01-03, fee_pct=0.0). 9 tp_r values updated where
# AAPL showed OOS edge under the wider weekdays trade population (more
# candidates survived audit than the tue_thu config). Strategies marked
# "T14 AAPL: no_edge; multi-symbol pending" still carry crypto-era values
# until a 4-symbol or 13-symbol WFO runs.
#
# T-A (2026-05-18): 4-symbol pooled-trades WFO (AAPL+MSFT+SPY+QQQ) closes out
# the "multi-symbol pending" markers from T14. Per tp_r, OOS closed_trades are
# concat'd across symbols → pick the tp_r with the highest pooled OOS avg_r
# subject to pooled_n ≥ 10. Cells with no positive pooled tp_r are kept at
# current value and retagged "no_edge confirmed".
#
# Task C (2026-05-18): /atr-sweep on liquidity_sweep × 4-sym cohort × 4h+1d+1wk
# × [0.5,1.0,1.5,2.0,2.5] × since 2023-01-03 × --atr-sl-floor on. Result: net
# negative at every multiplier on every TF — committed least-bad multipliers
# (4h=2.0×, 1d=0.5×) plus per-strategy `atr_sl_floor = true` under
# [strategy_params.liquidity_sweep]. Top-level atr_sl_floor stays off so no
# other strategy sees a behavior change. Other strategies' ATR floors are
# still owed a /atr-sweep follow-up.

extends = "strategy_params.toml"

# Symbols to watch — omit to use the full watchlist from config/stocks.json.
# symbols = ["AAPL", "MSFT"]

timeframes = ["4h", "1d", "1wk"]

# Suppress signals by day: "off" | "weekdays" (Mon–Fri) | "tue_thu" (Tue–Thu only)
day_filter = "weekdays"

strategies = [
    'orb',
    'liquidity_sweep',
    'bos',
    'eqh_eql',
    'order_block',
    'trend_day',
    'engulfing',
    'pin_bar',
    'inside_bar',
    'hammer_hanging_man',
    'doji',
    'morning_evening_star',
    'fib_golden_zone',
    'ema'
]

# atr_sl_multiplier = 2.0  # ATR-based SL: SL distance = N × ATR14; overrides sl_pct when set
# atr_sl_multiplier_values = [0.5, 1.0, 1.5, 2.0, 2.5]
# tp_r_values = [1.5, 2.0, 2.5, 3.0, 3.5, 4.0, 4.5, 5.0]

# T13: see signal_watch.toml — ORB is 4h-only on equity by mechanic.
[strategy_timeframes]
orb = ["4h"]

# Per-strategy overrides — T14 (2026-05-17) WFO on AAPL day_filter=weekdays.
[strategy_params.engulfing]
tp_r = 3.5                    # fallback
tp_r_4h = 3.0                 # Task A 4-sym n=87 +0.126R (supersedes T14 AAPL n=21 +0.429R @ 5.0)
tp_r_long_1d = 3.0            # Task A 4-sym directional: longs +0.824R, n=34 at 3.0 (Δ=0.70R)
tp_r_short_1d = 2.5           # Task A 4-sym directional: shorts +0.129R, n=31 at 2.5

[strategy_params.pin_bar]
tp_r = 3.5                    # fallback
tp_r_4h = 5.0                 # T-A 4-sym WFO OOS: +0.010R, n=99 (was 3.5); thin margin — only positive tp_r in the grid
tp_r_1d = 4.0                 # T14 AAPL WFO OOS: +0.207R, n=29 (was 3.5)

[strategy_params.hammer_hanging_man]
tp_r = 4.0                    # fallback
tp_r_4h = 4.0                 # T-A 4-sym WFO OOS: +0.083R, n=60 (unchanged — pooled confirmed current value)

[strategy_params.doji]
tp_r = 3.0                    # fallback (T14 AAPL: marginal only, kept current)
volume_suppress = true        # A14b crypto finding; T14 AAPL volume split not re-tested

[strategy_params.inside_bar]
tp_r = 3.0                    # fallback
tp_r_4h = 3.5                 # T14 AAPL WFO OOS: +0.452R, n=31 (equity-confirmed)
tp_r_1d = 2.5                 # T14 AAPL WFO OOS: +0.353R, n=17 (new)

[strategy_params.eqh_eql]
tp_r_4h = 2.0                 # T14 AAPL WFO OOS: +0.385R, n=13 (new)
tp_r_1d = 5.0                 # T-A 4-sym WFO OOS: +0.257R, n=35 (was 2.0)

[strategy_params.fib_golden_zone]
tp_r_4h = 3.5                 # T-A 4-sym: no_edge confirmed (best -0.045R, n=44); fallback retained
tp_r_1d = 4.5                 # T-A 4-sym WFO OOS: +0.540R, n=25 (was 3.5)

[strategy_params.bos]
tp_r = 3.0                    # T-A 4-sym: 4h no_edge confirmed (best -0.221R); 1d edge +0.191R at tp_r=3.0 (n=47) — combined value retained

[strategy_params.trend_day]
tp_r_4h = 4.0                 # T-A 4-sym WFO OOS: +0.072R, n=237; Task A confirmed (|Δ_dir|=0.01R <0.5R)
tp_r_1d = 3.0                 # T-A 4-sym +0.213R, n=211; Task A directional Δ=0.13R <0.5R — combined kept
tp_r_long_1wk = 2.5           # Task A 4-sym directional: longs +0.591R, n=22 at 2.5 (shorts n=14 no edge)

[strategy_params.orb]
tp_r_4h = 3.5                 # T-A 4-sym WFO OOS: +0.090R, n=162 (was 5.0)

[strategy_params.liquidity_sweep]
tp_r_1d = 5.0                 # T14 AAPL WFO OOS: +0.231R, n=13 (was 3.5)
# Task C ATR sweep (2026-05-18, /atr-sweep liquidity_sweep × AAPL+MSFT+SPY+QQQ
# × 4h+1d+1wk × [0.5,1.0,1.5,2.0,2.5] × since 2023-01-03 × --atr-sl-floor on).
# Findings (weekdays): 4h tied -0.18R @ 0.5×/2.0× (n=55). 1d clear winner
# -0.11R @ 0.5× (n=27). 1wk all -1.00R, n=3 (sample too thin). Strategy is
# net negative on this cohort at every multiplier on every TF — values
# minimize loss, do not deliver edge. Removal candidate if live cofiring
# gates don't rescue it.
atr_sl_floor = true           # Task C: ATR floor on; widens tight structural SLs to N × ATR14
atr_sl_multiplier_4h = 2.0    # Task C 4-sym: tied -0.18R @ 0.5×/2.0× (n=55); 2.0× kept for parity with tt
atr_sl_multiplier_1d = 0.5    # Task C 4-sym: clear wd winner -0.11R, n=27
# 1wk: no commit — n=3 all-stopped on weekdays, 0 signals on tue_thu

[strategy_params.morning_evening_star]
tp_r_4h = 3.5                 # Task A 4-sym n=110 +0.409R (supersedes T14 AAPL n=32 +0.375R @ 2.5)
tp_r_1d = 3.5                 # T-A 4-sym +0.406R, n=112; Task A long n=62 +1.032R also wins at 3.5
tp_r_1wk = 2.5                # Task A 4-sym n=20 +0.225R at 2.5 (shorts n=11 +0.273R; longs n=9 fail floor)

[strategy_params.order_block]
tp_r_1d = 3.0                 # T14 AAPL WFO OOS: +0.630R, n=27 (was 1.5)

[strategy_params.ema]
tp_r = 3.0                    # spec §6 default
tp_r_4h = 4.0                 # T-A 4-sym n=24 +0.042R; Task A confirms — longs +0.875R at n=9 (just under floor)
tp_r_long_1d = 5.0            # Task A 4-sym directional: longs +0.920R, n=25 at 5.0 (shorts n=8 fail floor)

# backtest and bias sections live in strategy_params.toml (base).
# Uncomment below to override specific backtest options for this config:
# [backtest]
# save_results = true
# volume_suppress = false
